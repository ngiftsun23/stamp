<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAMP demo data</title>
<style>body{font:16px/1.4 system-ui,sans-serif;background:#F3EFE4;color:#111;padding:1rem}</style>
</head>
<body>
<p id="msg">Loading demo habits…</p>
<script>
// Local test helper: fills STAMP's storage with mock habits relative to today, then opens the app.
// Lives in .dev/ because `netlify deploy` skips dot-folders: it must never reach the live site,
// where opening it would replace real habits. Serve the repo root and open /.dev/demo.html.
const pad = n => String(n).padStart(2, '0');
const keyOf = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const add = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return keyOf(d); };
const dow = s => ((parse(s).getDay() + 6) % 7) + 1;
const T = keyOf(new Date());
const ago = n => add(T, -n);
const mon = add(T, 1 - dow(T));

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const habits = [], logs = {};
function habit(id, o) {
  habits.push(Object.assign({ id, identity: '', cue: '', two: '', freq: 'daily', days: [1, 2, 3, 4, 5], times: 3,
    archived: false, pausedUntil: null, pauses: [] }, o));
  return logs[id] = {};
}

// Read: long history, a few old misses and skips, 29-day streak, today open (stamp -> 30-day toast), notes.
let L = habit('read', { name: 'Read', identity: 'reads every day', cue: 'pour my morning coffee', two: 'read one page', color: '#FFE14A', created: ago(110) });
for (let i = 110; i >= 1; i--) { const r = rnd(); L[ago(i)] = i > 29 && r < 0.12 ? null : { s: i > 29 && r < 0.17 ? 'skip' : 'done' }; if (!L[ago(i)]) delete L[ago(i)]; }
delete L[ago(30)]; // the miss that started the current streak
L[ago(3)] = { s: 'done', n: 'Finished chapter 4 on the train.' };
L[ago(9)] = { s: 'done', n: 'Only one page. Still counts.' };

// Stretch: missed yesterday, today open -> DON'T MISS TWICE banner.
L = habit('stretch', { name: 'Stretch', identity: 'takes care of my back', cue: 'get out of bed', two: 'one forward fold', color: '#FF5C8A', created: ago(40) });
for (let i = 40; i >= 2; i--) if (rnd() > 0.15) L[ago(i)] = { s: 'done' };

// Gym: 3x per week, this week 1/3, one frozen week covered by skips.
L = habit('gym', { name: 'Gym', identity: 'trains even when busy', cue: 'leave work on Mon, Wed or Fri', two: 'put on gym clothes', freq: 'weekly', times: 3, color: '#7AD7FF', created: add(mon, -70) });
for (let w = 1; w <= 10; w++) {
  const ws = add(mon, -7 * w);
  if (w === 4) { L[ws] = { s: 'done' }; L[add(ws, 2)] = { s: 'skip', n: 'Sick.' }; L[add(ws, 4)] = { s: 'skip' }; continue; }
  if (w === 7) { L[ws] = { s: 'done' }; continue; } // a real miss week
  L[ws] = { s: 'done' }; L[add(ws, 2)] = { s: 'done' }; L[add(ws, 4)] = { s: 'done' };
}
if (mon < T) L[mon] = { s: 'done' }; else L[T] = { s: 'done' };

// Meditate: weekdays only, a skip in the chain, already stamped today if today is a weekday.
L = habit('meditate', { name: 'Meditate', identity: 'stays calm under pressure', cue: 'sit down at my desk', two: 'three slow breaths', freq: 'weekdays', days: [1, 2, 3, 4, 5], color: '#C6F54A', created: ago(60) });
for (let i = 60; i >= 0; i--) { const d = ago(i); if (dow(d) <= 5) L[d] = { s: i === 5 ? 'skip' : 'done' }; }

// Journal: 6 days in a row, today open -> stamping today shows the 7-day toast.
L = habit('journal', { name: 'Journal', identity: 'thinks on paper', cue: 'brush my teeth at night', two: 'write one sentence', color: '#FF8A3D', created: ago(6) });
for (let i = 6; i >= 1; i--) L[ago(i)] = { s: 'done' };

// Water: 99 days straight, today open (stamp -> 100-day toast).
L = habit('water', { name: 'Glass of water', cue: 'wake up', two: 'one glass', color: '#7AD7FF', created: ago(99) });
for (let i = 99; i >= 1; i--) L[ago(i)] = { s: 'done' };

// No phone in bed: paused for 7 days starting 2 days ago.
L = habit('nophone', { name: 'No phone in bed', identity: 'sleeps well', cue: 'plug in my charger', color: '#FFE14A', created: ago(30),
  pauses: [[ago(2), add(ago(2), 6)]], pausedUntil: add(ago(2), 6) });
for (let i = 30; i >= 3; i--) if (rnd() > 0.25) L[ago(i)] = { s: 'done' };

// Long run: weekends only -> "Not due today" on weekdays. 8th active habit -> soft-cap warning.
L = habit('run', { name: 'Long run', cue: 'finish breakfast on the weekend', two: 'run to the corner', freq: 'weekdays', days: [6, 7], color: '#C6F54A', created: ago(50) });
for (let i = 50; i >= 1; i--) { const d = ago(i); if (dow(d) >= 6 && rnd() > 0.2) L[d] = { s: 'done' }; }

// Smoking (quit): three items, tapering slips, slipped yesterday -> banner; today clean so far.
L = habit('smoking', { kind: 'avoid', name: 'Smoking', identity: "doesn't need a cigarette to relax", cue: 'chew gum and walk around the block',
  items: [{ id: 'cig', name: 'Cigarettes' }, { id: 'cigar', name: 'Cigars' }, { id: 'shisha', name: 'Shisha' }], color: '#FF8A3D', created: ago(45) });
for (let i = 45; i >= 2; i--) {
  const r = rnd(), chance = i > 30 ? 0.75 : i > 14 ? 0.4 : 0.15;
  if (r < chance) { const c = { cig: 1 + Math.floor(rnd() * (i > 30 ? 8 : 3)) }; if (rnd() < 0.2) c.cigar = 1; if (rnd() < 0.25) c.shisha = 1; L[ago(i)] = { c }; }
}
L[ago(1)] = { c: { cig: 2, shisha: 1 }, n: 'Friends were smoking after dinner.' };

// Drinking (quit): last drink 8 days ago -> 7 days clean -> toast on opening TODAY.
L = habit('drinking', { kind: 'avoid', name: 'Drinking', identity: 'remembers my weekends', cue: 'order a sparkling water',
  items: [{ id: 'beer', name: 'Beer' }, { id: 'wine', name: 'Wine' }, { id: 'spirits', name: 'Spirits' }], color: '#7AD7FF', created: ago(60) });
for (let i = 60; i >= 9; i--) if (dow(ago(i)) >= 5 && rnd() < 0.6) L[ago(i)] = { c: { beer: 1 + Math.floor(rnd() * 4), ...(rnd() < 0.3 ? { wine: 2 } : {}), ...(rnd() < 0.2 ? { spirits: 1 } : {}) } };
L[ago(8)] = { c: { beer: 3, spirits: 2 }, n: 'Birthday. Last one for a while.' };
for (let i = 7; i >= 1; i--) delete L[ago(i)];

// Spanish: archived, history kept.
L = habit('spanish', { name: 'Spanish', identity: 'can order dinner in Madrid', two: 'one flashcard', color: '#FF5C8A', created: ago(90), archived: true });
for (let i = 90; i >= 45; i--) if (rnd() > 0.3) L[ago(i)] = { s: 'done' };

const data = { v: 1, habits, logs, settings: { boundary: 0 } };
let existing = null;
try { existing = localStorage.getItem('stamp-habits-v1'); } catch {}
if (existing && JSON.parse(existing).habits?.length && !confirm('Replace the habits currently saved in this browser with demo data?')) {
  document.getElementById('msg').textContent = 'Kept your existing data.';
} else {
  localStorage.setItem('stamp-habits-v1', JSON.stringify(data));
  localStorage.removeItem('stamp-install-hint-dismissed');
  location.replace('../index.html#today');
}
</script>
</body>
</html>
